evaluation:
  split_seed: 42
paths:
  corpus_dir: data/pdfs
  chroma_dir: data/index
  paper_meta: data/paper_meta.csv
  experiments_staging: data/experiments_staging.csv
  experiments_db: data/nasa_collection.duckdb
  eval_questions: eval/questions.csv
  eval_grade_sheet: eval/grade_sheet.csv
  eval_results: eval/results.md
